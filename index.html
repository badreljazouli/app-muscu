<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#F1F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<title>Carnet de muscu</title>
<style id="kit-style"></style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout : app iPhone. Grands titres en Archivo élargie, listes groupées, barre d'onglets en bas.
   L'interface reste en noir et craie : la seule couleur forte est celle de l'élastique (le niveau),
   reprise en grand pendant la séance. Chiffres en Archivo condensée, tabulaires. */
:root{
  --bg:#F1F2EF;
  --card:#FFFFFF;
  --fill:#E6E8E3;
  --fill-2:#D6D9D2;
  --line:#DCDFD8;
  --ink:#16191C;
  --ink-2:#575D64;
  --ink-3:#8C9298;
  --btn:#16191C;
  --btn-ink:#F7F8F5;
  --go:#1C7645;
  --go-soft:#DBEFE2;
  --hold:#875700;
  --hold-soft:#F6E9C8;
  --stop:#B3261E;
  --stop-soft:#F8DEDA;
  --b-jaune:#F2C230;
  --b-rouge:#D63A2C;
  --b-vert:#7DBB42;
  --b-orange:#F08A2A;
  --b-bleu:#2C66D8;
  --b-noir:#24282D;
  --hero-n:#3B4148;
  --hero-n-ink:#FFFFFF;
  --bar:rgba(241,242,239,.86);
  --overlay:rgba(22,25,28,.42);
  --lift:0 1px 3px rgba(22,25,28,.14);
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121417;
    --card:#1C1F23;
    --fill:#262A2F;
    --fill-2:#323840;
    --line:#2B3035;
    --ink:#ECEEE9;
    --ink-2:#A2A9B0;
    --ink-3:#6E757C;
    --btn:#ECEEE9;
    --btn-ink:#121417;
    --go:#6FD39A;
    --go-soft:#173323;
    --hold:#F0BE5A;
    --hold-soft:#3A2C10;
    --stop:#FF8A7E;
    --stop-soft:#3B1916;
    --b-noir:#060708;
    --hero-n:#363C43;
    --hero-n-ink:#ECEEE9;
    --bar:rgba(18,20,23,.86);
    --overlay:rgba(0,0,0,.6);
    --lift:0 1px 3px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
input,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) calc(108px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;flex-direction:column;margin-bottom:14px}
.top-row{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top-date{font-size:15px;color:var(--ink-2);font-weight:500}
.icon-btn{width:44px;height:44px;margin-right:-10px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:24px;height:24px}
.title{margin:0;font-size:38px;line-height:1;font-weight:800;font-stretch:120%;letter-spacing:-.02em}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:5px max(8px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;min-height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--ink)}

/* ---------- common blocks ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 2px 10px}
.sec h2{margin:0;font-size:22px;line-height:1.1;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.sec p,.sec span{margin:0;font-size:14px;color:var(--ink-2)}
.group{background:var(--card);border-radius:18px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 14px;border:0;background:transparent;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:70px;right:0;height:1px;background:var(--line)}
.row.plain+.row.plain::before{left:14px}
button.row:active{background:var(--fill)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r-name{font-size:17px;font-weight:650;line-height:1.25}
.r-sub{font-size:14px;color:var(--ink-2);line-height:1.35}
.r-goal{font-size:14px;font-weight:650;color:var(--ink);line-height:1.35}
.r-goal.up{color:var(--go)}
.r-end{flex:none;display:flex;align-items:center;gap:10px}
.r-target{font-size:16px;font-weight:700;font-stretch:72%;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.r-val{font-size:24px;font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-val small{font-size:14px;font-weight:600;color:var(--ink-2);font-stretch:100%}
.chev{width:9px;height:9px;flex:none;border-right:2px solid var(--ink-3);border-top:2px solid var(--ink-3);transform:rotate(45deg);margin-right:4px}
.badge{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:16px;font-weight:800;font-stretch:88%;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px rgba(127,127,127,.18)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:-1px;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.sw[data-k="jaune"]{background:var(--b-jaune);box-shadow:none}
.sw[data-k="rouge"]{background:var(--b-rouge);box-shadow:none}
.sw[data-k="vert"]{background:var(--b-vert);box-shadow:none}
.sw[data-k="bleu"]{background:var(--b-bleu);box-shadow:none}
.sw[data-k="noir"]{background:var(--b-noir);box-shadow:inset 0 0 0 1px var(--ink-3)}
.sw[data-k="double"]{background:linear-gradient(90deg,var(--b-bleu) 50%,var(--b-noir) 50%);box-shadow:inset 0 0 0 1px var(--ink-3)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--ink-2);vertical-align:1px;margin-left:6px}
.tag.go{background:var(--go-soft);color:var(--go)}
.note{margin:12px 4px 0;font-size:13px;color:var(--ink-2);line-height:1.45;max-width:60ch}
.empty{padding:18px 16px;margin:0;font-size:15px;color:var(--ink-2)}
.card{background:var(--card);border-radius:18px;padding:16px}

/* ---------- buttons & forms ---------- */
.btn-main{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:0 20px;border:0;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-size:18px;font-weight:700;font-stretch:106%;transition:transform .12s}
.btn-main:active{transform:scale(.985)}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:14px;background:var(--fill);color:var(--ink);font-size:16px;font-weight:650}
.btn-sec.w{width:100%}
.btn-sec.armed,.btn-del.armed{background:var(--stop);color:#FFFFFF}
.btn-del{min-height:48px;width:100%;border:0;border-radius:14px;background:var(--stop-soft);color:var(--stop);font-size:16px;font-weight:650}
.link{border:0;background:transparent;min-height:44px;padding:0 6px;font-size:16px;font-weight:600;color:var(--ink-2)}
.field{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:17px;-webkit-appearance:none;appearance:none}
textarea.field{min-height:100px;padding:12px 14px;font-size:16px;line-height:1.4;resize:vertical}
.lbl{display:block;margin:0 0 6px 2px;font-size:14px;font-weight:600;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--fill)}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-size:15px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--lift)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:52px;height:52px;flex:none;border:0;border-radius:50%;background:var(--fill);font-size:28px;line-height:1;display:grid;place-items:center}
.stepper output{flex:1;text-align:center;font-size:48px;line-height:1;font-weight:800;font-stretch:68%;font-variant-numeric:tabular-nums}
.stepper output small{font-size:17px;font-weight:600;color:var(--ink-2);font-stretch:100%;margin-left:4px}
.switch{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:16px;background:var(--fill-2);transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--go)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- séance (vue) ---------- */
.kit-pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kit-c{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.kit-c.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:18px;background:var(--card);margin-bottom:12px}
.banner p{flex:1;margin:0;font-size:15px;line-height:1.4}
.banner p b{display:block;font-size:16px}
.banner.live{background:var(--ink);color:var(--bg)}
.banner.live .btn-sec{background:var(--bg);color:var(--ink)}
.start{display:flex;flex-direction:column;gap:10px}
.start-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2px}
.start-meta p{margin:0;font-size:15px;color:var(--ink-2)}
.duo-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin:24px 4px 8px}
.duo-h b{font-size:16px;font-weight:700}
.duo-h span{font-size:14px;color:var(--ink-2)}

/* ---------- séance guidée ---------- */
.sess{position:fixed;inset:0;z-index:50;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.s-wrap{display:flex;flex-direction:column;height:100%;width:100%;max-width:560px;margin:0 auto}
.s-top{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px))}
.s-ico{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.s-ico svg{width:20px;height:20px}
.s-prog{flex:1;display:flex;gap:3px;height:6px;min-width:0}
.s-prog i{flex:1;border-radius:3px;background:var(--fill-2)}
.s-prog i.done{background:var(--ink)}
.s-prog i.now{background:var(--ink-3)}
.s-back{flex:none;min-height:44px;padding:0 8px;border:0;background:transparent;font-size:15px;font-weight:600;color:var(--ink-2)}
.s-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.s-foot{display:flex;flex-direction:column;gap:2px;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.s-foot .link{align-self:center}
.s-code{display:flex;align-items:center;gap:10px;margin:0;font-size:15px;font-weight:600;color:var(--ink-2)}
.badge-mini{min-width:36px;height:28px;padding:0 6px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:800;font-stretch:88%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.18)}
.s-name{margin:0;font-size:27px;line-height:1.05;font-weight:800;font-stretch:116%;letter-spacing:-.015em;text-wrap:balance}
.s-body>*{flex-shrink:0}
.lv-chips{position:relative;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:4px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lv-chips::-webkit-scrollbar{display:none}
.lv-chip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px 0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;white-space:nowrap}
.lv-chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:12px 12px 14px;border-radius:26px;background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 1px rgba(127,127,127,.2)}
.hero-set{margin:0;font-size:16px;font-weight:700}
.hero-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.pm{flex:none;width:60px;height:60px;border:0;border-radius:50%;background:rgba(255,255,255,.18);background:color-mix(in srgb,currentColor 17%,transparent);color:inherit;font-size:36px;line-height:1;font-weight:500;display:grid;place-items:center}
.pm:active{transform:scale(.94)}
.big{display:block;flex:1;text-align:center;font-size:clamp(84px,27vw,118px);line-height:.92;font-weight:800;font-stretch:62%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-unit{margin:0;font-size:15px;font-weight:600}
.chrono-btn{margin-top:10px;min-height:46px;padding:0 20px;border:0;border-radius:999px;background:rgba(255,255,255,.2);background:color-mix(in srgb,currentColor 18%,transparent);color:inherit;font-size:16px;font-weight:700}
.s-goal{margin:0;text-align:center;font-size:16px;color:var(--ink-2);line-height:1.4}
.s-goal b{color:var(--ink);font-weight:700}
.s-sets{display:flex;justify-content:center;gap:8px}
.s-set{min-width:72px;padding:7px 10px 8px;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;align-items:center}
.s-set small{font-size:12px;font-weight:600;color:var(--ink-2)}
.s-set b{font-size:24px;line-height:1.1;font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.s-set.ok b{color:var(--ink)}
.s-set.now{box-shadow:inset 0 0 0 2px var(--ink)}
.s-how{background:var(--card);border-radius:16px;padding:0 16px}
.s-how summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:50px;font-size:16px;font-weight:650;cursor:pointer}
.s-how summary::-webkit-details-marker{display:none}
.s-how summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin:0 4px 4px 0}
.s-how[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.s-how p{margin:0 0 14px;font-size:16px;line-height:1.5;color:var(--ink-2)}
.s-next{margin:0;text-align:center;font-size:15px;color:var(--ink-2)}
.s-next b{color:var(--ink)}
.r-label{margin:28px 0 0;text-align:center;font-size:18px;font-weight:700;color:var(--ink-2)}
.r-clock{display:block;text-align:center;font-size:clamp(124px,42vw,176px);line-height:.9;font-weight:800;font-stretch:62%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.elastic{height:28px;margin:6px 2px 10px;border-radius:14px;background:var(--fill);overflow:hidden}
.elastic span{display:block;height:100%;border-radius:14px;transform-origin:left center;transition:transform .25s linear}
.r-next{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card)}
.r-next small{display:block;font-size:14px;color:var(--ink-2)}
.r-next b{display:block;font-size:18px;line-height:1.25}
.r-next span{font-size:15px;color:var(--ink-2)}
.foot-row{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.foot-row .btn-main{min-height:54px}
.foot-row .btn-sec{min-height:54px;font-size:17px;font-variant-numeric:tabular-nums}
.done-title{margin:18px 0 0;font-size:40px;line-height:1;font-weight:800;font-stretch:120%;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px 12px 14px;border-radius:16px;background:var(--card)}
.stat b{display:block;font-size:38px;line-height:1;font-weight:800;font-stretch:66%;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.check{width:28px;height:28px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);display:grid;place-items:center}
.check svg{width:16px;height:16px;opacity:0}
.row.on .check{background:var(--ink);box-shadow:none}
.row.on .check svg{opacity:1}
.row.on .r-name{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}

/* ---------- semaine ---------- */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:8px 6px;border-radius:18px;background:var(--card)}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:12px}
.wk-d.today{background:var(--fill)}
.wk-n{font-size:12px;font-weight:600;color:var(--ink-2)}
.wk-num{font-size:19px;line-height:1;font-weight:750;font-stretch:84%;font-variant-numeric:tabular-nums}
.wk-marks{display:flex;gap:3px;height:9px}
.mk{width:9px;height:9px;border-radius:50%}
.mk-r{background:var(--ink)}
.mk-c{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 4px 0;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meter{padding:14px;border-radius:18px;background:var(--card)}
.meter h3{margin:0;font-size:15px;font-weight:700;color:var(--ink-2)}
.m-num{display:flex;align-items:baseline;gap:5px;margin:6px 0 10px}
.m-num b{font-size:46px;line-height:.95;font-weight:800;font-stretch:64%;font-variant-numeric:tabular-nums}
.m-num span{font-size:15px;font-weight:600;color:var(--ink-2)}
.track{position:relative;height:8px;border-radius:4px;background:var(--fill)}
.track i{display:block;height:100%;max-width:100%;border-radius:4px;background:var(--ink)}
.track i.ok{background:var(--go)}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink-3)}
.pips{display:flex;gap:6px;height:8px}
.pips i{flex:1;max-width:44px;border-radius:4px;background:var(--fill)}
.pips i.on{background:var(--go)}
.m-note{margin:10px 0 0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.chart{padding:16px 14px 12px;border-radius:18px;background:var(--card)}
.plot{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:150px;margin-top:20px;border-bottom:1px solid var(--line)}
.bcol{display:flex;align-items:flex-end;min-width:0}
.bar{position:relative;width:100%;border-radius:6px 6px 0 0;background:var(--fill-2)}
.bar.ok{background:var(--ink)}
.bar .v{position:absolute;bottom:100%;left:-4px;right:-4px;margin-bottom:3px;text-align:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-3);z-index:1;pointer-events:none}
.goal span{position:absolute;left:0;bottom:3px;padding-right:4px;background:var(--card);font-size:11px;line-height:1.1;color:var(--ink-2)}
.xrow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:6px;text-align:center;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.xrow .cur{color:var(--ink);font-weight:700}
.xrow i{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:var(--ink)}

/* ---------- progrès ---------- */
.w-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.w-big{font-size:58px;line-height:.95;font-weight:800;font-stretch:66%;font-variant-numeric:tabular-nums}
.w-big small{font-size:20px;font-weight:600;color:var(--ink-2);font-stretch:100%;margin-left:4px}
.w-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;color:var(--ink-2);text-align:right}
.w-delta{font-weight:700}
.w-delta.down{color:var(--go)}
.w-delta.up{color:var(--hold)}
.scale{position:relative;display:flex;height:12px;margin:18px 0 26px}
.scale .z{height:100%}
.scale .z1{background:var(--go-soft);border-radius:6px 0 0 6px}
.scale .z2{background:var(--hold-soft)}
.scale .z3{background:var(--stop-soft);border-radius:0 6px 6px 0}
.scale .dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid var(--card);transform:translate(-50%,-50%)}
.scale .tick{position:absolute;top:17px;font-size:12px;color:var(--ink-2);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.w-legend{margin:0;font-size:13px;color:var(--ink-2);line-height:1.4}
.spark{display:block;width:100%;height:auto;margin-top:14px}
.spark polyline{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--ink);stroke:var(--card);stroke-width:2}
.spark-x{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mini{flex:none;width:76px;height:28px}
.mini polyline{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mini circle{fill:var(--ink)}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.overlay{position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .overlay{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sh-handle{width:38px;height:5px;margin:4px auto 10px;border-radius:3px;background:var(--fill-2)}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh-head h2{margin:0;font-size:26px;line-height:1.05;font-weight:800;font-stretch:114%;letter-spacing:-.015em;text-wrap:balance}
.sh-head p{margin:4px 0 0;font-size:15px;color:var(--ink-2)}
.sh-x{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600}
.sh-sec{margin:22px 2px 8px;font-size:15px;font-weight:700;color:var(--ink-2)}
.sh-text{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 14px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row p{margin:0;font-size:16px}
.set-row p small{display:block;font-size:13px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{padding:8px 10px 8px 0;text-align:left;font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl{overflow-x:auto;padding:4px 14px 8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;text-align:center;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fig{display:block;width:100%;height:auto;background:var(--card);border-radius:18px;cursor:pointer;-webkit-user-select:none;user-select:none}
.fg-floor{stroke:var(--line);stroke-width:2}
.fg-prop{fill:var(--fill-2)}
.fg-prop2{fill:var(--fill)}
.fg-pl{stroke:var(--fill-2);stroke-width:6;stroke-linecap:round}
.fg-anchor{fill:var(--ink-2)}
.fg-limb{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.fg-far{stroke:var(--ink-3)}
.fg-torso{fill:none;stroke:var(--ink);stroke-width:17;stroke-linecap:round}
.fg-shoulders,.fg-hips{fill:none;stroke:var(--ink);stroke-width:12;stroke-linecap:round}
.fg-top{stroke-width:15}
.fg-head{fill:var(--ink)}
.fg-halo{fill:none;stroke:var(--card);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.fg-band{fill:none;stroke-width:4;stroke-linecap:round}
.fg-towel{fill:var(--ink-3)}
.s-how .fig{margin:2px 0 12px}
.r-fig{margin-top:2px}
.sh-fig{margin:0 0 12px}
.fig-hint{margin:-4px 0 12px;font-size:13px;color:var(--ink-2);text-align:center}
.s-head{display:flex;align-items:center;gap:10px}
.s-slot{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink-2)}
.lv-pill{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px 0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:650;white-space:nowrap}
.lv-pill::after{content:"";width:6px;height:6px;margin:-3px 1px 0 3px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg)}
.lv-pill[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:4px}
.s-fig .fig{height:min(27vh,220px)}
.s-where{display:flex;align-items:center;gap:8px;margin:8px 4px 0;font-size:15px;line-height:1.35;color:var(--ink-2)}
.s-where b{color:var(--ink);font-weight:650}
.setup{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.setup b{display:block;margin-bottom:2px;font-size:14px;font-weight:700;color:var(--ink)}
.setup p{margin:0;font-size:15px;line-height:1.45;color:var(--ink-2)}
.cues{margin:0;padding-left:18px;font-size:15px;line-height:1.45;color:var(--ink-2)}
.cues li+li{margin-top:4px}
.sh-setup{margin-top:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.title{font-size:33px}.s-name{font-size:27px}.meters{grid-template-columns:1fr}}
</style>
</head>
<body>

<script>
(function(){
'use strict';

/* ============ outils ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0]||1970,(p[1]||1)-1,p[2]||1);};
const today=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fDay=new Intl.DateTimeFormat('fr-BE',{weekday:'short',day:'numeric',month:'short'});
const fLong=new Intl.DateTimeFormat('fr-BE',{weekday:'long',day:'numeric',month:'long'});
const dm=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1);
const num=n=>String(n).replace('.',',');
const clock=s=>Math.floor(s/60)+':'+pad(s%60);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const list=(arr,unit)=>arr.join(', ')+(unit==='s'?' s':'');

/* ============ programme ============ */
/* Les 3 boucles Domyos (10, 20, 30 kg), puis leurs combinaisons : deux boucles ensemble additionnent à peu près leur résistance. */
const BANDS=[
  {k:'k10',label:'Élastique 10 kg',s:'10 kg'},
  {k:'k20',label:'Élastique 20 kg',s:'20 kg'},
  {k:'k30',label:'Élastique 30 kg',s:'30 kg'},
  {k:'k40',label:'10 + 30 kg ensemble',s:'10 + 30 kg'},
  {k:'k50',label:'20 + 30 kg ensemble',s:'20 + 30 kg'},
  {k:'k60',label:'Les trois ensemble',s:'Les trois'}
];
const COMBO={k10:[10],k20:[20],k30:[30],k40:[30,10],k50:[30,20],k60:[30,20,10]};
/* anciens niveaux par couleur, gardés pour l'historique */
const LEGACY={jaune:'Élastique jaune',rouge:'Élastique rouge',vert:'Élastique vert',bleu:'Élastique bleu',noir:'Élastique noir',double:'Deux élastiques'};
const BW={k:'pdc',label:'Poids du corps',s:'Poids du corps'};
const BWB=[BW].concat(BANDS);
const L=(k,label)=>({k,label,s:label});
const EXOS=[
  /* Jambes */
  {id:'fentes',name:'Fentes bulgares',target:'3 × 8–12',note:'par jambe',sets:3,min:8,max:12,levels:BWB,
   how:"Pied arrière posé sur le canapé, descends jusqu'à ce que le genou arrière frôle le sol, buste droit. Avec élastique : sous le pied avant, poignées tenues le long du corps."},
  {id:'squat',name:"Squat à l'élastique",target:'3 × 10–15',sets:3,min:10,max:15,levels:BWB,
   how:"Debout sur l'élastique, pieds écartés de la largeur des épaules, poignées aux épaules. Descends jusqu'à avoir les cuisses parallèles au sol, dos droit, talons au sol."},
  {id:'fentes_arr',name:'Fentes arrière alternées',target:'3 × 8–12',note:'par jambe',sets:3,min:8,max:12,levels:BWB,
   how:"Recule d'un grand pas, descends le genou arrière vers le sol, puis pousse sur le talon avant pour revenir. Avec élastique : sous le pied avant."},
  {id:'montee',name:'Montées sur chaise',target:'3 × 8–12',note:'par jambe',sets:3,min:8,max:12,
   levels:[BW,L('sac','Sac à dos chargé'),L('sac_lourd','Sac à dos bien chargé')],
   how:"Chaise stable calée contre un mur, ou marche d'escalier. Monte en poussant sur la jambe d'appui, sans t'aider de l'autre, et redescends lentement."},
  {id:'chaise_mur',name:'Chaise contre le mur',target:'3 × 30–60 s',sets:3,min:30,max:60,unit:'s',
   levels:[L('classique','Classique'),L('sac','Sac à dos sur les cuisses'),L('jambe','Une jambe tendue')],
   how:"Dos plaqué au mur, cuisses parallèles au sol, genoux au-dessus des chevilles. Respire normalement pendant tout le maintien."},
  /* Dos */
  {id:'rowing_assis',name:'Rowing assis',target:'3 × 10–15',sets:3,min:10,max:15,levels:BANDS,
   how:"Assis au sol, jambes tendues, boucle passée sous la plante des pieds. Tire les coudes vers l'arrière en serrant les omoplates."},
  {id:'tirage_ecarte',name:'Tirage écarté au-dessus de la tête',target:'3 × 10–15',sets:3,min:10,max:15,levels:BANDS,
   how:"Bras tendus au-dessus de la tête, boucle tenue entre les mains. Écarte les mains en descendant les coudes jusqu'à la poitrine."},
  {id:'rowing',anchor:true,name:'Rowing debout (accroche)',target:'3 × 10–15',sets:3,min:10,max:15,levels:BANDS,
   how:"Élastique accroché à la porte, côté charnières, tiré dans le sens qui ferme la porte. Tire les coudes vers l'arrière en serrant les omoplates."},
  {id:'rowing_table',name:'Rowing inversé sous une table',target:'3 × 6–12',sets:3,min:6,max:12,
   levels:[L('genoux','Genoux pliés'),L('tendues','Jambes tendues'),L('pieds','Pieds surélevés')],
   how:"Allongé sous une table très solide, mains au bord. Tire la poitrine vers la table, corps gainé. Vérifie d'abord qu'elle ne peut pas basculer."},
  {id:'tirage_haut',anchor:true,name:'Tirage vertical (accroche en hauteur)',target:'3 × 10–15',sets:3,min:10,max:15,levels:BANDS,
   how:"Élastique accroché en haut de la porte, à genoux face à elle. Tire les coudes vers les hanches, poitrine sortie."},
  {id:'rowing_1bras',name:'Rowing un bras',target:'3 × 10–15',note:'par bras',sets:3,min:10,max:15,levels:BANDS,
   how:"Pied sur l'élastique, buste penché, main libre posée sur une chaise. Tire le coude vers la hanche en gardant le dos plat."},
  /* Poitrine et triceps */
  {id:'pompes',name:'Pompes',target:'3 × 8–15',sets:3,min:8,max:15,
   levels:[L('table','Mains sur une table'),L('sol','Classiques'),L('pieds','Pieds surélevés'),L('elast','Élastique dans le dos')],
   how:"Corps gainé de la tête aux talons, coudes à 45° du corps. Arrête-toi 1 ou 2 répétitions avant l'échec."},
  {id:'pompes_serrees',name:'Pompes mains serrées',target:'3 × 6–12',sets:3,min:6,max:12,
   levels:[L('table','Mains sur une table'),L('sol','Classiques'),L('pieds','Pieds surélevés')],
   how:"Mains sous les épaules, coudes collés au corps en descendant. Travaille surtout les triceps."},
  {id:'dips',name:'Dips sur une chaise',target:'3 × 8–15',sets:3,min:8,max:15,
   levels:[L('pliees','Jambes pliées'),L('tendues','Jambes tendues'),L('pieds','Pieds sur une 2e chaise')],
   how:"Mains au bord d'une chaise stable calée contre un mur. Descends jusqu'à ce que les coudes forment un angle droit, pas plus bas."},
  {id:'dev_sol',name:"Développé au sol à l'élastique",target:'3 × 10–15',sets:3,min:10,max:15,levels:BANDS,
   how:"Allongé sur le dos, élastique passé sous les omoplates. Pousse les poings vers le plafond, puis redescends jusqu'à ce que les coudes touchent le sol."},
  /* Fessiers et ischios */
  {id:'pont',name:'Pont fessier',target:'3 × 12–15',sets:3,min:12,max:15,levels:BWB,
   how:"Sur le dos, pieds à plat. Pousse dans les talons et serre les fessiers une seconde en haut. Élastique au-dessus des genoux ou sur les hanches."},
  {id:'hip_thrust',name:'Hip thrust au canapé',target:'3 × 10–15',sets:3,min:10,max:15,
   levels:[BW,L('sac','Sac à dos sur les hanches'),L('une','Une jambe')],
   how:"Haut du dos appuyé sur le canapé, pieds à plat. Monte les hanches jusqu'à aligner épaules et genoux, menton rentré."},
  {id:'sdt',name:'Soulevé de terre jambes tendues',target:'3 × 10–15',sets:3,min:10,max:15,levels:BANDS,
   how:"Debout sur l'élastique, genoux légèrement fléchis. Penche le buste dos plat en reculant les fesses, puis remonte en serrant les fessiers."},
  {id:'leg_curl',name:'Leg curl sur serviette',target:'3 × 8–12',sets:3,min:8,max:12,
   levels:[L('deux','Deux jambes'),L('une','Une jambe')],
   how:"Sur le dos, talons sur une serviette posée sur un sol lisse. Monte les hanches, puis ramène les talons vers les fesses et repousse lentement."},
  /* Épaules */
  {id:'epaules',name:'Développé épaules',target:'3 × 10–12',sets:3,min:10,max:12,levels:BANDS,
   how:"Debout sur l'élastique, pousse les mains au-dessus de la tête sans cambrer le bas du dos."},
  {id:'elev_lat',name:'Élévations latérales',target:'3 × 12–15',sets:3,min:12,max:15,levels:BANDS,
   how:"Debout sur l'élastique, monte les bras sur les côtés jusqu'à l'horizontale, coudes légèrement fléchis, sans hausser les épaules."},
  {id:'pike',name:'Pompes piquées',target:'3 × 6–12',sets:3,min:6,max:12,
   levels:[L('sol','Pieds au sol'),L('chaise','Pieds sur une chaise')],
   how:"Hanches hautes, corps en V à l'envers. Descends le haut du crâne vers le sol entre les mains, puis repousse."},
  /* Haut du dos */
  {id:'visage',anchor:true,name:'Tirage vers le visage (accroche)',target:'2 × 12–15',sets:2,min:12,max:15,levels:BANDS,
   how:"Élastique accroché à hauteur des yeux. Tire vers le front en écartant les coudes. Bon contre le dos voûté du télétravail."},
  {id:'pull_apart',name:"Écartés à l'élastique",target:'2 × 15–20',sets:2,min:15,max:20,levels:BANDS,
   how:"Bras tendus devant toi à hauteur d'épaules, écarte l'élastique jusqu'à ce qu'il touche la poitrine."},
  {id:'yt',name:'Y-T allongé',target:'2 × 10–15',sets:2,min:10,max:15,
   levels:[BW,L('bouteilles','Bouteilles de 50 cl')],
   how:"Allongé sur le ventre, front sur une serviette, pouces vers le plafond. Lève les bras en Y, redescends, puis en T."},
  {id:'rot_ext',name:"Rotation externe d'épaule",target:'2 × 12–15',sets:2,min:12,max:15,levels:BANDS,
   how:"Boucle tenue entre les mains, coudes collés au corps. Écarte les avant-bras vers l'extérieur. Protège les épaules."},

const PAL={vert:{c:'var(--b-vert)',fg:'#1D1A0E',n:'Vert'},jaune:{c:'var(--b-jaune)',fg:'#1D1A0E',n:'Jaune'},orange:{c:'var(--b-orange)',fg:'#1D1A0E',n:'Orange'},rouge:{c:'var(--b-rouge)',fg:'#FFFFFF',n:'Rouge'},bleu:{c:'var(--b-bleu)',fg:'#FFFFFF',n:'Bleu'},noir:{c:'var(--b-noir)',fg:'#FFFFFF',n:'Noir'}};
const kitColor=kg=>PAL[(st.settings.kit||{})['k'+kg]]||PAL.jaune;
const isBandLevel=k=>!!COMBO[k]||!!LEGACY[k];
function lvlStyle(k){
  if(COMBO[k]){
    const parts=COMBO[k].map(kitColor);
    return {bg:parts[0].c,fg:parts[0].fg,stripes:parts.slice(1).map(p=>p.c),n:COMBO[k].length};
  }
  switch(k){
    case 'jaune':return {bg:'var(--b-jaune)',fg:'#1D1A0E'};
    case 'rouge':return {bg:'var(--b-rouge)',fg:'#FFFFFF'};
    case 'vert':return {bg:'var(--b-vert)',fg:'#1D1A0E'};
    case 'bleu':return {bg:'var(--b-bleu)',fg:'#FFFFFF'};
    case 'noir':return {bg:'var(--b-noir)',fg:'#FFFFFF'};
    case 'double':return {bg:'linear-gradient(115deg,var(--b-bleu) 0 50%,var(--b-noir) 50% 100%)',fg:'#FFFFFF'};
    default:return {bg:'var(--hero-n)',fg:'var(--hero-n-ink)'};
  }
}
/* une bande de couleur en haut pour chaque élastique ajouté */
const stripeShadow=(sty,h)=>(sty.stripes||[]).map((c,i)=>`inset 0 ${(i+1)*h}px 0 ${c}`).join(',');
function applyKit(){
  let css='';
  Object.keys(COMBO).forEach(k=>{
    const parts=COMBO[k].map(kitColor), n=parts.length;
    const bg=n===1?parts[0].c:`linear-gradient(90deg,${parts.map((p,i)=>`${p.c} ${Math.round(i*100/n)}% ${Math.round((i+1)*100/n)}%`).join(',')})`;
    css+=`.sw[data-k="${k}"]{background:${bg};box-shadow:${parts.some(p=>p===PAL.noir)?'inset 0 0 0 1px var(--ink-3)':'none'}}`;
  });
  const el=document.getElementById('kit-style');if(el)el.textContent=css;
}
const badge=(code,k,cls)=>{const s=lvlStyle(k);const sh=stripeShadow(s,cls==='badge-mini'?4:5);return `<span class="${cls||'badge'}" style="background:${s.bg};color:${s.fg}${sh?';box-shadow:'+sh:''}">${esc(code)}</span>`;};

function loadState(){
  const s=Object.assign(clone(DEF),lsGet(KEY)||{});
  s.settings=Object.assign({},DEF.settings,s.settings||{});
  if(!Array.isArray(s.entries)) s.entries=[];
  s.entries=s.entries.filter(e=>e&&e.kind&&e.date);
  s.entries.sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!s.plan||typeof s.plan!=='object') s.plan={};
  if(!s.levels||typeof s.levels!=='object') s.levels={};
  s.settings.kit=Object.assign({},DEF.settings.kit,s.settings.kit||{});
  if((s.v||1)<2){
    /* passage aux boucles 10/20/30 kg : les anciens niveaux par couleur ne correspondent plus */
    Object.keys(s.levels).forEach(id=>{if(LEGACY[s.levels[id]])delete s.levels[id];});
    SLOTS.forEach(sl=>{const id=s.plan[sl.id];if(id&&EXO_BY[id]&&EXO_BY[id].anchor)delete s.plan[sl.id];});
    s.v=2;
  }
  return s;
}
let st=loadState();
let persistAsked=false;
function save(){
  const ok=lsSet(KEY,st);
  if(!ok) toast("Mémoire pleine : tes données n'ont pas pu être enregistrées.");
  if(ok&&!persistAsked){persistAsked=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}}
  return ok;
}
function addEntry(e){st.entries.unshift(Object.assign({id:uid(),ts:Date.now()},e));st.entries.sort((a,b)=>(b.ts||0)-(a.ts||0));save();}
function removeEntry(id){st.entries=st.entries.filter(e=>e.id!==id);save();}

/* ============ progression ============ */
function lastRec(id){
  for(const e of st.entries){if(e.kind==='force'&&e.exos&&e.exos[id])return {entry:e,rec:e.exos[id]};}
  return null;
}
function currentExo(slot){
  const p=st.plan[slot.id];
  if(p&&slot.options.includes(p)) return p;
  for(const e of st.entries){
    if(e.kind==='force'&&e.exos){const hit=slot.options.find(id=>e.exos[id]&&(st.settings.anchor||!EXO_BY[id].anchor));if(hit)return hit;}
  }
  return slot.options[0];
}
function currentLevel(ex){
  const k=st.levels[ex.id];
  if(k&&lvlIdx(ex,k)>=0) return k;
  const lr=lastRec(ex.id);
  if(lr&&lvlIdx(ex,lr.rec.level)>=0) return lr.rec.level;
  return ex.levels[0].k;
}
/* Double progression : on garde le niveau et on ajoute une répétition (ou 5 s) à la série la plus faible,
   jusqu'au haut de la fourchette sur toutes les séries ; alors on passe au niveau suivant. */
function goalFor(ex,lvOverride){
  const lv=lvOverride||currentLevel(ex);
  const lr=lastRec(ex.id);
  const step=ex.unit==='s'?5:1;
  if(!lr||lr.rec.level!==lv){
    const up=!!(lr&&lvlIdx(ex,lv)>lvlIdx(ex,lr.rec.level));
    return {level:lv,sets:Array(ex.sets).fill(ex.min),fresh:true,up,first:!lr};
  }
  const s=[];
  for(let i=0;i<ex.sets;i++){const v=+((lr.rec.sets||[])[i])||0;s.push(v>0?v:ex.min);}
  let idx=-1,low=Infinity;
  s.forEach((v,i)=>{if(v<ex.max&&v<low){low=v;idx=i;}});
  if(idx<0) s.forEach((v,i)=>{if(v<low){low=v;idx=i;}});
  s[idx]+=step;
  return {level:lv,sets:s,fresh:false,up:false,first:false};
}
function estimateMin(){
  let sec=180;
  DUOS.forEach(d=>{
    const exs=SLOTS.filter(s=>s.duo===d.n).map(s=>EXO_BY[currentExo(s)]);
    const n=Math.max(...exs.map(e=>e.sets));
    exs.forEach(e=>{sec+=e.sets*(e.unit==='s'?(e.max+15):40);});
    sec+=n*(d.core?st.settings.restCore:st.settings.restDuo);
  });
  return Math.round(sec/60/5)*5;
}

let actx=null, wl=null;
function unlockAudio(){
  try{
    if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A();}
    if(actx&&actx.state==='suspended')actx.resume();
    if(actx){const b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();src.buffer=b;src.connect(actx.destination);src.start(0);}
  }catch(e){}
}
function tone(f,dur,at,vol){
  if(!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+(at||0);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
function tickSound(){if(st.settings.sound)tone(660,0.09,0,0.16);}
function endSound(){
  if(st.settings.sound){tone(880,0.16,0,0.3);tone(1320,0.26,0.17,0.3);}
  try{if(navigator.vibrate)navigator.vibrate([180,80,180]);}catch(e){}
}
async function wakeOn(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){wl=null;}}
function wakeOff(){try{if(wl)wl.release();}catch(e){}wl=null;}

/* ============ silhouettes animées ============ */
const FIG=(function(){
const FL=212, AY=206;
const LEN={T:50,N:7,R:10,UA:30,FA:27,TH:40,SH:40,FT:11};
const SW=13, HW=7;
const rad=d=>d*Math.PI/180;
const dir=(a,l)=>[Math.cos(rad(a))*l,Math.sin(rad(a))*l];
const add=(p,v)=>[p[0]+v[0],p[1]+v[1]];
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
function lerpA(a,b,t){let d=((b-a)%360+540)%360-180;return a+d*t;}
function ik(root,target,a,b,s){
  const dx=target[0]-root[0], dy=target[1]-root[1];
  let d=Math.hypot(dx,dy);
  d=Math.max(Math.abs(a-b)+0.01,Math.min(a+b-0.01,d));
  const th=Math.atan2(dy,dx);
  const al=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))));
  const ang=th+(s||1)*al;
  const mid=[root[0]+a*Math.cos(ang),root[1]+a*Math.sin(ang)];
  const ang2=Math.atan2(target[1]-mid[1],target[0]-mid[0]);
  return [mid,[mid[0]+b*Math.cos(ang2),mid[1]+b*Math.sin(ang2)]];
}
function limb(root,spec,a,b){
  if(spec.to) return ik(root,spec.to,a,b,spec.s);
  const k=spec.k||[1,1];
  const mid=add(root,dir(spec.a[0],a*k[0]));
  return [mid,add(mid,dir(spec.a[1],b*k[1]))];
}
function mixLimb(A,B,t){
  if(!A) return null;
  const o={};
  if(A.to){o.to=lerpP(A.to,B.to,t);o.s=A.s;}
  else{o.a=[lerpA(A.a[0],B.a[0],t),lerpA(A.a[1],B.a[1],t)];const ka=A.k||[1,1],kb=B.k||[1,1];o.k=[lerp(ka[0],kb[0],t),lerp(ka[1],kb[1],t)];}
  if(A.ft!=null) o.ft=lerpA(A.ft,B.ft!=null?B.ft:A.ft,t);
  return o;
}
function mix(A,B,t){
  return {hip:lerpP(A.hip,B.hip,t),t:lerpA(A.t,B.t,t),hd:lerpA(A.hd!=null?A.hd:A.t,B.hd!=null?B.hd:B.t,t),
    a1:mixLimb(A.a1,B.a1,t),a2:mixLimb(A.a2,B.a2,t),l1:mixLimb(A.l1,B.l1,t),l2:mixLimb(A.l2,B.l2,t)};
}
/* pose -> points */
function solve(view,p){
  const J={};
  const sc=add(p.hip,dir(p.t,LEN.T));
  J.hip=p.hip;J.sh=sc;
  J.head=add(sc,dir(p.hd,LEN.N+LEN.R));
  let sL=sc,sR=sc,hL=p.hip,hR=p.hip;
  if(view==='front'){sL=[sc[0]-SW,sc[1]];sR=[sc[0]+SW,sc[1]];hL=[p.hip[0]-HW,p.hip[1]];hR=[p.hip[0]+HW,p.hip[1]];}
  if(view==='top'){sL=[p.hip[0]-17,p.hip[1]];sR=[p.hip[0]+17,p.hip[1]];J.head=p.hip;}
  J.sL=sL;J.sR=sR;J.hL=hL;J.hR=hR;
  const arm=(root,spec)=>{if(!spec)return null;const [e,h]=limb(root,spec,LEN.UA,LEN.FA);return [root,e,h];};
  const leg=(root,spec,dft,fl)=>{if(!spec)return null;const [k,a]=limb(root,spec,LEN.TH,LEN.SH);const ft=spec.ft!=null?spec.ft:dft;return [root,k,a,add(a,dir(ft,fl))];};
  J.a1=arm(sL,p.a1);J.a2=arm(sR,p.a2);
  if(view==='front'){J.l1=leg(hL,p.l1,160,6);J.l2=leg(hR,p.l2,20,6);}
  else {J.l1=leg(hL,p.l1,0,LEN.FT);J.l2=leg(hR,p.l2,0,LEN.FT);}
  return J;
}

const bandColor=k=>lvlStyle(k).bg.startsWith('linear')?'var(--b-bleu)':lvlStyle(k).bg;
const bandWidth=k=>4+2*((COMBO[k]||[0]).length-1);
function svg(id,level,cls){
  const s=S[id];if(!s)return '';
  const v=s.view||'side';
  const showBand=s.band&&isBandLevel(level);
  const far=v==='side'?' fg-far':'';
  return `<svg class="fig ${cls||''}" viewBox="0 0 300 220" data-fig="${id}" data-band="${showBand?esc(level):''}" role="img" aria-label="Animation de l'exercice. Touche pour mettre en pause.">
    ${s.noFloor?'':floor}${s.props||''}
    <g class="fg-body">
      ${s.towel?'<rect class="fg-towel" x="0" y="207" width="28" height="5" rx="2"/>':''}
      ${v!=='top'?`<path class="fg-limb${far}" data-j="l2"/>`:''}
      <path class="fg-limb${far}" data-j="a2"/>
      ${v!=='top'?`<path class="fg-limb" data-j="l1"/>`:''}
      ${v==='front'?'<path class="fg-hips" data-j="hips"/><path class="fg-shoulders" data-j="shs"/>':''}
      ${v==='top'?'<path class="fg-shoulders fg-top" data-j="shs"/>':'<path class="fg-torso" data-j="torso"/>'}
      <circle class="fg-head" data-j="head" r="${LEN.R}"/>
      <path class="fg-halo" data-j="a1h"/>
      <path class="fg-limb" data-j="a1"/>
      ${showBand?s.band.map((b,i)=>`<path class="fg-band" data-b="${i}" style="stroke:${bandColor(level)};stroke-width:${bandWidth(level)}"/>`).join(''):''}
    </g>
  </svg>`;
}
const ease=x=>-(Math.cos(Math.PI*x)-1)/2;
function phase(s,time){
  const tm=s.tm||[.4,1.3,.3,1.3];const tot=tm[0]+tm[1]+tm[2]+tm[3];
  let x=time%tot;
  if(x<tm[0])return 0;x-=tm[0];
  if(x<tm[1])return ease(x/tm[1]);x-=tm[1];
  if(x<tm[2])return 1;x-=tm[2];
  return 1-ease(x/tm[3]);
}
function draw(el,t){
  const id=el.dataset.fig,s=S[id];if(!s)return;
  const v=s.view||'side';
  const J=solve(v,mix(s.A,s.B,t));
  const set=(j,d)=>{const n=el.querySelector('[data-j="'+j+'"]');if(n)n.setAttribute('d',d);};
  if(J.l1)set('l1',pts(J.l1));if(J.l2)set('l2',pts(J.l2));
  if(J.a1){set('a1',pts(J.a1));set('a1h',pts(J.a1));}if(J.a2)set('a2',pts(J.a2));
  if(v==='front'){set('hips',pts([J.hL,J.hR]));set('shs',pts([J.sL,J.sR]));set('torso',pts([J.hip,J.sh]));}
  else if(v==='top'){set('shs',pts([J.sL,J.sR]));}
  else set('torso',pts([J.hip,J.sh]));
  const h=el.querySelector('[data-j="head"]');if(h){h.setAttribute('cx',J.head[0].toFixed(1));h.setAttribute('cy',J.head[1].toFixed(1));}
  if(s.towel&&J.l1){const tw=el.querySelector('.fg-towel');if(tw)tw.setAttribute('x',(J.l1[2][0]-12).toFixed(1));}
  if(el.dataset.band&&s.band){
    const pt=k=>Array.isArray(k)?k:k==='sh'?[J.sh[0],J.sh[1]+6]:k[0]==='l'?J[k][2]:J[k][2];
    s.band.forEach((b,i)=>{const n=el.querySelector('[data-b="'+i+'"]');if(n)n.setAttribute('d',pts([pt(b[0]),pt(b[1])]));});
  }
}
let raf=0,last=0;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){
  const els=document.querySelectorAll('svg.fig');
  if(!els.length){raf=0;return;}
  els.forEach(el=>{
    if(!el._t0)el._t0=now;
    if(el._paused||reduce){if(!el._drawn){draw(el,reduce?1:el._p||0);el._drawn=true;}return;}
    const p=phase(S[el.dataset.fig],(now-el._t0)/1000*(el._speed||1));
    el._p=p;draw(el,p);
  });
  raf=requestAnimationFrame(loop);
}
function start(){$$('svg.fig').forEach(el=>{el._drawn=false;draw(el,0);});if(!raf)raf=requestAnimationFrame(loop);}
function toggle(el){
  if(el._paused){el._paused=false;el._t0=performance.now()-((el._pausedAt||0)-(el._t0||0));}
  else{el._paused=true;el._pausedAt=performance.now();el._drawn=false;}
}
return {svg,start,toggle,has:id=>!!S[id],S,draw};

/* ---------- vue Séance ---------- */
function exoRow(slot){
  const ex=EXO_BY[currentExo(slot)];
  const lv=currentLevel(ex), Lv=lvlOf(ex,lv), lr=lastRec(ex.id), g=goalFor(ex);
  let sub=Lv.s;
  if(lr) sub+=', dernière fois '+list((lr.rec.sets||[]).filter(n=>n>0),ex.unit);
  let goal;
  if(g.first) goal='<span class="r-goal">Nouveau : commence à '+ex.min+(ex.unit==='s'?' s':'')+'</span>';
  else if(g.up) goal='<span class="r-goal up">Niveau monté. Objectif '+list(g.sets,ex.unit)+'</span>';
  else if(g.fresh) goal='<span class="r-goal">Objectif '+list(g.sets,ex.unit)+'</span>';
  else goal='<span class="r-goal">Objectif '+list(g.sets,ex.unit)+'</span>';
  return `<button class="row" type="button" data-act="exo" data-slot="${slot.id}">
    ${badge(slot.code,lv)}
    <span class="r-main"><span class="r-name">${esc(ex.name)}</span><span class="r-sub"><i class="sw" data-k="${esc(lv)}"></i> ${esc(sub)}</span>${goal}</span>
    <span class="r-end"><span class="r-target">${esc(ex.target)}</span><i class="chev"></i></span>
  </button>`;
}
function viewSeance(){

    h+=`<div class="duo-h"><b>${d.letter}. ${esc(d.name)}</b><span>${rest}</span></div><div class="group">${slots.map(exoRow).join('')}</div>`;

  h+=`<p class="note">Touche un exercice pour changer de variante ou de niveau. Couleurs de tes élastiques : ${[10,20,30].map(kg=>kitColor(kg).n.toLowerCase()+' '+kg+' kg').join(', ')}. Tu peux les changer dans Réglages.</p>`;
  return h;
}

/* ---------- vue Semaine ---------- */
function weekStats(a,b){
  const w=st.entries.filter(e=>{if(!KINDS[e.kind])return false;const d=parseISO(e.date);return d>=a&&d<b;});
  const eq=w.reduce((s,e)=>s+KINDS[e.kind].factor*(+e.minutes||0),0);
  const renfo=new Set(w.filter(e=>e.kind==='force').map(e=>e.date)).size;
  return {w,eq,renfo};
}
function viewSemaine(){
  const now=new Date(), m0=monday(now), m1=addDays(m0,7), td=today();
  const cur=weekStats(m0,m1);
  const days=[0,1,2,3,4,5,6].map(i=>addDays(m0,i));
  let h=`<div class="wk">${days.map((d,i)=>{
    const k=iso(d), es=cur.w.filter(e=>e.date===k);
    const r=es.some(e=>e.kind==='force'), c=es.some(e=>e.kind!=='force');
    return `<div class="wk-d${k===td?' today':''}"><span class="wk-n">${'LMMJVSD'[i]}</span><span class="wk-num">${d.getDate()}</span><span class="wk-marks">${r?'<i class="mk mk-r"></i>':''}${c?'<i class="mk mk-c"></i>':''}</span></div>`;
  }).join('')}</div>
  <div class="legend"><span><i class="mk mk-r"></i>Renforcement</span><span><i class="mk mk-c"></i>Cardio</span></div>`;

  const scale=Math.max(300,cur.eq), mk=150/scale*100;
  let note;
  if(cur.eq>=300) note="Zone de bénéfice maximal de l'OMS atteinte.";
  else if(cur.eq>=150) note="Minimum de l'OMS atteint. Jusqu'à 300, le bénéfice augmente encore.";
  else {const r=150-cur.eq;note=`Encore ${r} min, ou ${Math.ceil(r/2)} min de course ou de foot.`;}
  let pips='';for(let i=0;i<Math.max(2,Math.min(cur.renfo,4));i++)pips+=`<i class="${i<cur.renfo?'on':''}"></i>`;
  h+=`<div class="sec"><h2>Objectifs de l'OMS</h2></div>
  <div class="meters">
    <div class="meter"><h3>Endurance</h3><div class="m-num"><b>${cur.eq}</b><span>/ 150 min</span></div>
      <div class="track"><i class="${cur.eq>=150?'ok':''}" style="width:${Math.min(100,cur.eq/scale*100)}%"></i><b style="left:${mk}%"></b></div>
      <p class="m-note">${esc(note)}</p></div>
    <div class="meter"><h3>Renforcement</h3><div class="m-num"><b>${cur.renfo}</b><span>/ 2 jours</span></div>
      <div class="pips">${pips}</div>
      <p class="m-note">${cur.renfo>=2?'Objectif atteint cette semaine.':'Les séances du carnet comptent automatiquement.'}</p></div>
  </div>
  <p class="note">Course et foot comptent double : pour l'OMS, une minute d'effort intense vaut deux minutes d'effort modéré. Le renforcement se compte en jours, à part.</p>`;

  const lst=cur.w.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.ts||0)-(a.ts||0));
  h+=`<div class="sec"><h2>Activités</h2></div>
  <button class="btn-sec w" type="button" data-act="add-act">Ajouter une activité</button>
  <div class="group" style="margin-top:10px">${lst.length?lst.map(e=>{
    const k=KINDS[e.kind];
    const sub=cap(fDay.format(parseISO(e.date)))+(k.factor===2?', compte double':'');
    return `<button class="row plain" type="button" data-act="entry" data-id="${esc(e.id)}"><span class="r-main"><span class="r-name">${esc(k.label)}</span><span class="r-sub">${esc(sub)}</span></span><span class="r-end"><span class="r-val">${+e.minutes||0}<small> min</small></span><i class="chev"></i></span></button>`;
  }).join(''):'<p class="empty">Rien cette semaine. Une séance du carnet ou une course, et ça démarre.</p>'}</div>`;

  const weeks=[];
  for(let k=7;k>=0;k--){const a=addDays(m0,-7*k);weeks.push(Object.assign({a},weekStats(a,addDays(a,7))));}
  const top=Math.ceil(Math.max(300,...weeks.map(w=>w.eq))/50)*50;
  const aria=weeks.map(w=>'Semaine du '+dm(w.a)+' : '+w.eq+' minutes, '+w.renfo+' jour(s) de renforcement').join('. ');
  h+=`<div class="sec"><h2>8 dernières semaines</h2></div>
  <div class="chart">
    <div class="plot" role="img" aria-label="${esc(aria)}">
      <div class="goal" style="bottom:${150/top*100}%"><span>150</span></div>
      ${weeks.map(w=>`<div class="bcol"><div class="bar${w.eq>=150?' ok':''}" style="height:${w.eq/top*100}%">${w.eq?`<span class="v">${w.eq}</span>`:''}</div></div>`).join('')}
    </div>
    <div class="xrow">${weeks.map((w,i)=>`<span${i===7?' class="cur"':''}>${dm(w.a)}</span>`).join('')}</div>
    <div class="xrow">${weeks.map(w=>`<span>${'<i></i>'.repeat(Math.min(w.renfo,4))}</span>`).join('')}</div>
  </div>
  <div class="legend"><span>Barres : minutes d'endurance</span><span>Points : jours de renforcement</span></div>`;
  return h;
}

/* ---------- vue Progrès ---------- */
function scaleHTML(v){
  const lo=75,hi=110,p=x=>(Math.min(hi,Math.max(lo,x))-lo)/(hi-lo)*100;
  return `<div class="scale" aria-hidden="true"><span class="z z1" style="width:${p(94)}%"></span><span class="z z2" style="width:${p(102)-p(94)}%"></span><span class="z z3" style="width:${100-p(102)}%"></span>${v?`<span class="dot" style="left:${p(v)}%"></span>`:''}<span class="tick" style="left:${p(94)}%">94</span><span class="tick" style="left:${p(102)}%">102</span></div>
  <p class="w-legend">Repères chez l'homme : moins de 94 cm souhaitable, 102 cm et plus, risque nettement accru.</p>`;
}
function sparkSVG(vals,W,H,cls){
  const P=cls==='mini'?3:8;
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mx-mn<1){mn-=1;mx+=1;}
  const X=i=>P+(vals.length===1?(W-2*P)/2:i*(W-2*P)/(vals.length-1));
  const Y=v=>P+(mx-v)/(mx-mn)*(H-2*P);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const last=vals.length-1;
  return `<svg class="${cls}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}"/>${cls==='mini'?`<circle cx="${X(last).toFixed(1)}" cy="${Y(vals[last]).toFixed(1)}" r="3"/>`:vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===last?5:3}"/>`).join('')}</svg>`;
}
function viewProgres(){
  const ws=st.entries.filter(e=>e.kind==='taille'&&+e.cm>0).sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.ts||0)-(b.ts||0));
  let h=`<div class="sec"><h2>Tour de taille</h2></div><div class="card">`;
  if(!ws.length){
    h+=`<p class="sh-text">Pas encore de mesure. La première sera ton point de départ.</p>${scaleHTML(null)}`;
  } else {
    const last=ws[ws.length-1], first=ws[0], d=Math.round((last.cm-first.cm)*10)/10;
    const delta=ws.length>1?`<span class="w-delta${d<0?' down':d>0?' up':''}">${d>0?'+':d<0?'−':''}${num(Math.abs(d))} cm depuis le ${dm(parseISO(first.date))}</span>`:'';
    h+=`<div class="w-top"><span class="w-big">${num(last.cm)}<small>cm</small></span><span class="w-meta"><span>Mesuré le ${esc(fDay.format(parseISO(last.date)))}</span>${delta}</span></div>${scaleHTML(+last.cm)}`;
    if(ws.length>1){
      const pts=ws.slice(-12);
      h+=sparkSVG(pts.map(x=>+x.cm),320,84,'spark')+`<div class="spark-x"><span>${dm(parseISO(pts[0].date))}</span><span>${dm(parseISO(pts[pts.length-1].date))}</span></div>`;
    }
  }
  h+=`<button class="btn-sec w" type="button" data-act="waist" style="margin-top:16px">Noter une mesure</button></div>`;

  const map={};
  st.entries.filter(e=>e.kind==='force'&&e.exos).forEach(e=>{
    Object.keys(e.exos).forEach(id=>{if(EXO_BY[id])(map[id]=map[id]||[]).push({e,r:e.exos[id]});});
  });
  const ids=Object.keys(map).sort((a,b)=>(map[b][0].e.ts||0)-(map[a][0].e.ts||0));
  h+=`<div class="sec"><h2>Exercices</h2><span>${ids.length?ids.length+' suivis':''}</span></div><div class="group">`;
  h+=ids.length?ids.map(id=>{
    const ex=EXO_BY[id], recs=map[id], lv=currentLevel(ex);
    const best=Math.max(...recs.map(x=>Math.max(0,...(x.r.sets||[]).map(Number))));
    const totals=recs.slice(0,10).reverse().map(x=>(x.r.sets||[]).reduce((s,v)=>s+(+v||0),0));
    return `<button class="row" type="button" data-act="exo-info" data-id="${id}">${badge(SLOT_OF[id].code,lv)}<span class="r-main"><span class="r-name">${esc(ex.name)}</span><span class="r-sub">${esc(lvlOf(ex,lv).s)}, record ${best}${ex.unit==='s'?' s':' rép.'}</span></span>${totals.length>1?sparkSVG(totals,76,28,'mini'):''}<i class="chev"></i></button>`;
  }).join(''):'<p class="empty">Tes exercices apparaîtront ici après ta première séance.</p>';
  h+='</div>';

  const fs=st.entries.filter(e=>e.kind==='force').slice(0,40);
  h+=`<div class="sec"><h2>Séances</h2><span>${fs.length?fs.length+' au total':''}</span></div><div class="group">`;
  h+=fs.length?fs.map(e=>{
    const n=Object.keys(e.exos||{}).length;
    return `<button class="row plain" type="button" data-act="entry" data-id="${esc(e.id)}"><span class="r-main"><span class="r-name">${esc(cap(fDay.format(parseISO(e.date))))}</span><span class="r-sub">${n} exercice${n>1?'s':''}, ${+e.minutes||0} min</span></span><i class="chev"></i></button>`;
  }).join(''):'<p class="empty">Aucune séance enregistrée pour l’instant.</p>';
  h+='</div>';
  const hasData=st.entries.length>0, old=!st.lastBackup||Date.now()-st.lastBackup>30*864e5;
  if(hasData&&old) h+=`<p class="note">Tes données restent sur ce téléphone. Fais une sauvegarde de temps en temps dans Réglages.</p>`;
  return h;
}

/* ============ séance guidée ============ */
let live=lsGet(LIVE_KEY);
if(live&&(!live.steps||Date.now()-(live.startedAt||0)>12*3600e3)){live=null;lsDel(LIVE_KEY);}
if(live&&live.done){live=null;lsDel(LIVE_KEY);}
let ticker=null;
function saveLive(){if(live)lsSet(LIVE_KEY,live);else lsDel(LIVE_KEY);}
function buildLive(){
  const steps=[];
  DUOS.forEach(d=>{
    const slots=SLOTS.filter(s=>s.duo===d.n);
    const exs=slots.map(s=>EXO_BY[currentExo(s)]);
    const n=Math.max(...exs.map(e=>e.sets));
    const rest=d.core?st.settings.restCore:st.settings.restDuo;
    for(let i=0;i<n;i++){
      exs.forEach((ex,j)=>{if(i<ex.sets)steps.push({t:'set',exo:ex.id,code:slots[j].code,slot:slots[j].id,i});});
      steps.push({t:'rest',sec:rest});
    }
  });
  while(steps.length&&steps[steps.length-1].t==='rest')steps.pop();
  const logs={};
  steps.forEach(s=>{if(s.t==='set'&&!logs[s.exo]){const ex=EXO_BY[s.exo],g=goalFor(ex);logs[s.exo]={level:g.level,goal:g.sets,sets:Array(ex.sets).fill(null)};}});
  return {startedAt:Date.now(),steps,idx:-1,logs,cur:{},warm:[],restEnd:0,restTotal:0,chrono:null,done:false,summary:null};
}
function openSess(){
  $('#sess').hidden=false;lockBody();

}
function closeSess(){
  clearInterval(ticker);ticker=null;wakeOff();
  $('#sess').hidden=true;$('#sess').innerHTML='';lockBody();
}
const setSteps=()=>live.steps.map((s,k)=>({s,k})).filter(x=>x.s.t==='set');
function sessTop(){
  const segs=live.steps.map((s,k)=>s.t==='set'?`<i class="${k<live.idx?'done':k===live.idx?'now':''}"></i>`:'').join('');
  const prev=prevSetIdx();
  return `<div class="s-top">
    <button class="s-ico" type="button" data-act="sess-quit" aria-label="Arrêter la séance"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    <div class="s-prog" aria-hidden="true">${segs}</div>
    <button class="s-back" type="button" data-act="sess-back"${prev<0?' disabled':''}>Précédente</button>
  </div>`;
}
function prevSetIdx(){for(let k=live.idx-1;k>=0;k--){if(live.steps[k].t==='set')return k;}return -1;}
function curVal(k){
  const s=live.steps[k], log=live.logs[s.exo];
  if(live.cur[k]!=null) return live.cur[k];
  if(log.sets[s.i]!=null) return log.sets[s.i];
  return log.goal[s.i];
}
function renderSess(){
  const el=$('#sess');
  if(!live){closeSess();return;}
  if(live.done){el.innerHTML=doneHTML();return;}
  if(live.idx<0){el.innerHTML=warmHTML();return;}
  const step=live.steps[live.idx];
  el.innerHTML=step.t==='rest'?restHTML():setHTML(step);
  FIG.start();
  if(step.t==='rest')tick();
  else{const row=$('#sess .lv-chips'),on=row&&row.querySelector('.on');if(on)row.scrollLeft=Math.max(0,on.offsetLeft-(row.clientWidth-on.offsetWidth)/2);}
}

}
function nextSetFrom(k){for(let j=k;j<live.steps.length;j++){if(live.steps[j].t==='set')return j;}return -1;}
function restHTML(){

      ${nextBlock}
    </div>
    <div class="s-foot"><div class="foot-row"><button class="btn-sec" type="button" data-act="rest-add" data-d="-15">−15 s</button><button class="btn-sec" type="button" data-act="rest-add" data-d="15">+15 s</button><button class="btn-main" type="button" data-act="rest-skip">Reprendre</button></div></div>
  </div>`;
}
function doneHTML(){
  const s=live.summary||{};
  let h=`<div class="s-wrap"><div class="s-body">
    <h2 class="done-title">${s.saved?'Séance terminée':'Rien à enregistrer'}</h2>`;
  if(s.saved){
    const pl=(n,one,many)=>n>1?many:one;
    h+=`<div class="stats"><div class="stat"><b>${s.minutes}</b><span>${pl(s.minutes,'minute','minutes')}</span></div><div class="stat"><b>${s.sets}</b><span>${pl(s.sets,'série','séries')}</span></div><div class="stat"><b>${s.reps}</b><span>${pl(s.reps,'répétition','répétitions')}</span></div></div>
    <p class="sh-sec" style="margin-top:8px">Prochaine séance</p>
    <div class="group">${(s.next||[]).map(x=>{const ex=EXO_BY[x.id];const Lv=lvlOf(ex,x.level);return `<div class="row plain">${badge(SLOT_OF[x.id].code,x.level)}<span class="r-main"><span class="r-name">${esc(ex.name)}</span><span class="r-goal${x.bumped?' up':''}">${x.bumped?'Niveau supérieur : '+esc(Lv.s)+'. ':''}Objectif ${esc(list(x.goal,ex.unit))}</span></span></div>`;}).join('')}</div>`;
  } else {
    h+=`<p class="sh-text">Aucune série n'a été validée, donc rien n'a été enregistré.</p>`;
  }
  h+=`</div><div class="s-foot"><button class="btn-main" type="button" data-act="done-close">Fermer</button></div></div>`;
  return h;
}
function goTo(k){
  live.chrono=null;ui.lvOpen=false;
  if(k>=live.steps.length){finish();return;}
  live.idx=k;
  const s=live.steps[k];
  if(s.t==='rest'){live.restTotal=s.sec;live.restEnd=Date.now()+s.sec*1000;ui.lastBeep=null;}
  saveLive();renderSess();
  const b=$('#sess .s-body');if(b)b.scrollTop=0;
}
function tick(){
  if(!live||live.done||live.idx<0)return;
  const s=live.steps[live.idx];
  if(s.t==='rest'){
    const ms=live.restEnd-Date.now(), sec=Math.max(0,Math.ceil(ms/1000));
    const c=$('#r-clock');if(c)c.textContent=clock(sec);
    const f=$('#elastic');if(f)f.style.transform=`scaleX(${Math.max(0,Math.min(1,ms/(live.restTotal*1000)))})`;
    if(sec<=3&&sec>0&&ui.lastBeep!==sec){ui.lastBeep=sec;if(ms>-1500)tickSound();}
    if(ms<=0){if(ms>-3000)endSound();goTo(live.idx+1);}
  } else if(live.chrono&&live.chrono.k===live.idx){
    const el=Math.floor((Date.now()-live.chrono.start)/1000);
    const b=$('#big');if(b&&b.textContent!==String(el))b.textContent=el;
    const g=live.logs[s.exo].goal[s.i];
    if(el>=g&&!live.chrono.rang){live.chrono.rang=true;endSound();}
  }
}
function finish(){
  const exos={};let sets=0,reps=0;
  Object.keys(live.logs).forEach(id=>{
    const l=live.logs[id], ex=EXO_BY[id];
    const arr=l.sets.map(v=>+v>0?+v:0);
    if(arr.some(v=>v>0)){exos[id]={level:l.level,sets:arr};arr.forEach(v=>{if(v>0){sets++;if(ex.unit!=='s')reps+=v;}});}
  });
  const minutes=Math.max(1,Math.round((Date.now()-live.startedAt)/60000));
  const summary={saved:false,minutes,sets,reps,next:[]};
  if(Object.keys(exos).length){
    addEntry({kind:'force',date:today(),minutes,exos});
    ORDER.filter(id=>exos[id]).forEach(id=>{
      const ex=EXO_BY[id], r=exos[id], done=r.sets.filter(v=>v>0);
      let lv=r.level, bumped=false;
      if(done.length>=ex.sets&&done.every(v=>v>=ex.max)){const i=lvlIdx(ex,lv);if(i>=0&&i<ex.levels.length-1){lv=ex.levels[i+1].k;bumped=true;}}
      st.levels[id]=lv;
      summary.next.push({id,bumped,level:lv,goal:goalFor(ex,lv).sets});
    });
    SLOTS.forEach(s=>{st.plan[s.id]=currentExo(s);});
    save();
    summary.saved=true;
    toast('Séance enregistrée');
  }
  live.done=true;live.summary=summary;live.chrono=null;
  saveLive();wakeOff();renderSess();render();
}

/* ============ actions ============ */
function startSession(){
  unlockAudio();
  live=buildLive();saveLive();openSess();render();
}
function adjust(d){
  const s=live.steps[live.idx];if(!s||s.t!=='set')return;
  const ex=EXO_BY[s.exo], step=ex.unit==='s'?5:1;
  let v=curVal(live.idx)+d*step;
  v=Math.max(0,Math.min(ex.unit==='s'?900:300,v));
  live.cur[live.idx]=v;saveLive();
  const b=$('#big');if(b)b.textContent=v;
}
function validateSet(){
  const s=live.steps[live.idx];if(!s||s.t!=='set')return;
  if(live.chrono&&live.chrono.k===live.idx){live.cur[live.idx]=Math.floor((Date.now()-live.chrono.start)/1000);live.chrono=null;}
  const v=curVal(live.idx);
  live.logs[s.exo].sets[s.i]=Math.max(0,+v||0);
  delete live.cur[live.idx];
  goTo(live.idx+1);
}
function shuffle(){
  SLOTS.forEach(s=>{
    const cur=currentExo(s), alts=s.options.filter(id=>id!==cur&&(st.settings.anchor||!EXO_BY[id].anchor));
    st.plan[s.id]=alts[Math.floor(Math.random()*alts.length)];
  });
  save();render();toast(`Nouvelle combinaison : ${SLOTS.length} exercices différents`);
}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}
function backupText(){return 'MUSCU1:'+b64e(JSON.stringify({app:'carnet-muscu',v:1,at:Date.now(),entries:st.entries,plan:st.plan,levels:st.levels,settings:st.settings}));}
function markBackup(){st.lastBackup=Date.now();save();}
function restoreFrom(text){
  let t=String(text||'').trim();
  if(!t){toast('Colle d’abord une sauvegarde dans le champ.');return;}
  let data=null;
  try{data=t.startsWith('MUSCU1:')?JSON.parse(b64d(t.slice(7))):JSON.parse(t);}catch(e){data=null;}
  if(!data||!Array.isArray(data.entries)){toast('Sauvegarde illisible : vérifie que tu as copié tout le texte.');return;}
  const have=new Set(st.entries.map(e=>e.id));let added=0;
  data.entries.forEach(e=>{if(e&&e.id&&e.kind&&e.date&&!have.has(e.id)){st.entries.push(e);added++;}});
  st.entries.sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(data.levels)st.levels=Object.assign({},data.levels,st.levels);
  if(data.plan&&!Object.keys(st.plan).length)st.plan=Object.assign({},data.plan);
  save();closeSheet();render();
  toast(added?`Sauvegarde restaurée : ${added} entrée${added>1?'s':''} ajoutée${added>1?'s':''}`:'Rien de nouveau dans cette sauvegarde');
}

document.addEventListener('click',ev=>{
  const fig=ev.target.closest('svg.fig');
  if(fig){FIG.toggle(fig);return;}
  const el=ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  if(el.dataset.confirm&&!el.classList.contains('armed')){
    el.dataset.label=el.textContent;el.classList.add('armed');el.textContent=el.dataset.confirm;
    setTimeout(()=>{if(el.isConnected&&el.classList.contains('armed')){el.classList.remove('armed');el.textContent=el.dataset.label;}},4000);
    return;
  }
  const a=el.dataset.act;
  switch(a){
    case 'tab':ui.tab=el.dataset.tab;render();window.scrollTo(0,0);break;
    case 'settings':sheetSettings();break;
    case 'close-sheet':closeSheet();break;
    case 'install-ok':st.installHidden=true;save();render();break;
    case 'start':
      if(live&&!live.done){openSess();break;}
      startSession();break;
    case 'resume':unlockAudio();openSess();break;
    case 'shuffle':shuffle();break;
    case 'exo':sheetExo(currentExo(SLOT_BY[el.dataset.slot]));break;
    case 'exo-info':sheetExo(el.dataset.id);break;
    case 'set-level':st.levels[el.dataset.id]=el.dataset.k;save();render();sheetExo(el.dataset.id);break;
    case 'swap':{
      const slot=SLOT_BY[el.dataset.slot];st.plan[slot.id]=el.dataset.to;save();closeSheet();render();
      toast(`${slot.code} ${slot.label} : ${EXO_BY[el.dataset.to].name}`);break;}
    case 'add-act':ui.form={kind:'course',min:30,date:today()};sheetAct();break;
    case 'act-kind':{
      const d=$('#act-date');if(d)ui.form.date=d.value||today();
      ui.form.kind=el.dataset.k;sheetAct();break;}
    case 'act-min':{
      ui.form.min=Math.max(5,Math.min(600,ui.form.min+ +el.dataset.d));
      const o=$('#act-min');if(o)o.innerHTML=ui.form.min+'<small>min</small>';break;}
    case 'act-save':{
      const d=$('#act-date');const date=(d&&d.value)||today();
      addEntry({kind:ui.form.kind,date,minutes:ui.form.min});closeSheet();render();
      toast(`Ajouté : ${KINDS[ui.form.kind].label}, ${ui.form.min} min`);break;}
    case 'waist':sheetWaist();break;
    case 'waist-save':{
      const cm=parseFloat(String($('#w-cm').value).replace(',','.'));
      if(!(cm>=50&&cm<=200)){toast('Indique ton tour de taille en centimètres, entre 50 et 200.');break;}
      const date=$('#w-date').value||today();
      addEntry({kind:'taille',date,cm:Math.round(cm*10)/10});closeSheet();render();
      toast(`Mesure notée : ${num(Math.round(cm*10)/10)} cm`);break;}
    case 'entry':sheetEntry(el.dataset.id);break;
    case 'del-entry':{
      removeEntry(el.dataset.id);render();
      if(ui.sheet==='waist')sheetWaist();else closeSheet();
      toast('Supprimé');break;}
    case 'set-rest-duo':st.settings.restDuo=+el.dataset.v;save();render();sheetSettings();break;
    case 'set-rest-core':st.settings.restCore=+el.dataset.v;save();render();sheetSettings();break;
    case 'kit-color':st.settings.kit['k'+el.dataset.kg]=el.dataset.c;save();applyKit();render();sheetSettings();break;
    case 'toggle-anchor':st.settings.anchor=!st.settings.anchor;save();el.setAttribute('aria-checked',String(st.settings.anchor));render();break;
    case 'toggle-sound':st.settings.sound=!st.settings.sound;save();el.setAttribute('aria-checked',String(st.settings.sound));if(st.settings.sound){unlockAudio();tone(880,0.12,0,0.25);}break;
    case 'backup-copy':{
      const t=backupText();
      const fallback=()=>{const o=$('#backup-out');o.hidden=false;o.value=t;$('#backup-help').hidden=false;o.focus();o.select();};
      try{navigator.clipboard.writeText(t).then(()=>{markBackup();toast('Sauvegarde copiée. Colle-la dans Notes ou dans un mail.');sheetSettings();},fallback);}catch(e){fallback();}
      break;}
    case 'backup-share':{
      const t=backupText();
      try{navigator.share({title:'Sauvegarde Carnet de muscu',text:t}).then(()=>{markBackup();sheetSettings();},()=>{});}catch(e){}
      break;}
    case 'restore':restoreFrom($('#restore-in').value);break;
    case 'wipe':
      st=clone(DEF);save();live=null;saveLive();closeSheet();render();toast('Toutes les données ont été effacées');break;
    /* séance */
    case 'warm':{const i=+el.dataset.i;live.warm[i]=!live.warm[i];saveLive();el.classList.toggle('on',!!live.warm[i]);break;}
    case 'warm-go':goTo(nextSetFrom(0));break;
    case 'sess-quit':
      if(live&&live.idx<0){live=null;saveLive();closeSess();render();break;}
      sheetQuit();break;
    case 'quit-save':closeSheet();finish();break;
    case 'quit-discard':live=null;saveLive();closeSheet();closeSess();render();toast('Séance abandonnée');break;
    case 'sess-back':{const p=prevSetIdx();if(p>=0)goTo(p);break;}
    case 'lv-toggle':ui.lvOpen=!ui.lvOpen;renderSess();break;
    case 'sess-level':{
      const s=live.steps[live.idx], ex=EXO_BY[s.exo], log=live.logs[s.exo];
      if(log.level!==el.dataset.k){log.level=el.dataset.k;const g=goalFor(ex,log.level);log.goal=g.sets;
        live.steps.forEach((x,k)=>{if(x.t==='set'&&x.exo===s.exo&&log.sets[x.i]==null)delete live.cur[k];});
        saveLive();}
      ui.lvOpen=false;renderSess();
      break;}
    case 'inc':adjust(1);break;
    case 'dec':adjust(-1);break;
    case 'chrono':
      unlockAudio();
      if(live.chrono&&live.chrono.k===live.idx){live.cur[live.idx]=Math.floor((Date.now()-live.chrono.start)/1000);live.chrono=null;}
      else live.chrono={k:live.idx,start:Date.now(),rang:false};
      saveLive();renderSess();break;
    case 'validate':validateSet();break;
    case 'skip':goTo(live.idx+1);break;
    case 'rest-add':live.restEnd+=(+el.dataset.d)*1000;live.restTotal=Math.max(1,live.restTotal+(+el.dataset.d));if(live.restEnd<Date.now())live.restEnd=Date.now();saveLive();tick();break;
    case 'rest-skip':goTo(live.idx+1);break;
    case 'done-close':live=null;saveLive();closeSess();render();break;
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.sheet)closeSheet();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(live&&!live.done&&!$('#sess').hidden){wakeOn();tick();}
  if(!ui.sheet&&$('#sess').hidden)render();
});

/* ============ démarrage ============ */
applyKit();
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
})();
</script>
</body>
</html>
